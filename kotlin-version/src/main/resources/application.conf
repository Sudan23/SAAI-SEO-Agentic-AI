ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }

    application {
        modules = [ ai.saai.ApplicationKt.module ]
    }
}

saai {
    openai {
        apiKey = ${?OPENAI_API_KEY}
        model = "gpt-4o"
    }

    crawl {
        concurrency = 10
        politenessDelayMs = 500
        userAgent = "SAIBot/0.1 (+https://github.com/saai)"
    }

    agents {
        enableAll = true
    }
}
